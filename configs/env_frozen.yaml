# =============================================================================
# PF-20: frozen base experimental environment (Version 1 simulator audit)
# =============================================================================
# Status: Proposed — pending team review (see docs/decisions.md, Section 8,
# and docs/assumptions.md for the audit this freeze is based on).
#
# This file resolves to the exact same settings as configs/environment.json
# and therefore shares the same `config_hash` (comments and YAML/JSON
# formatting are not part of the hash; only the resolved field values are).
# It is a second, explicitly labeled artifact marking the environment as
# frozen for PF-21 agent tuning and final testing: once the group approves
# this hashed configuration, PF-21 tunes the agent against this fixed task
# instead of an evolving simulator. Any later change to these values, to
# `nfl_pack.json`, or to the simulator/scenario semantics must create a new
# version and rerun every affected comparison (docs/decisions.md Section 7).
#
# Values are unchanged from configs/environment.json; see docs/assumptions.md
# for the full review of the probability model, baseline comparisons, price
# transitions, fees, and action constraints that this freeze is based on,
# including why ALWAYS_OPEN is a dominant simple strategy here by design
# rather than a defect.
horizon: 100
initial_cash: 100.0
selling_fee_rate: 0.05
pack_config: nfl_pack.json
market:
  initial_regime: NORMAL
  quotes:
    LOW: {pack_ask: 8.0, card_value_multiplier: 0.75}
    NORMAL: {pack_ask: 10.0, card_value_multiplier: 1.0}
    HIGH: {pack_ask: 12.0, card_value_multiplier: 1.6}
  transition_matrix:
    LOW: [0.7, 0.25, 0.05]
    NORMAL: [0.15, 0.7, 0.15]
    HIGH: [0.05, 0.25, 0.7]
