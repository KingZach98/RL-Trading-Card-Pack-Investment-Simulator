# =============================================================================
# PF-20: predetermined fee-sensitivity variant — HIGH selling fee (double base)
# =============================================================================
# Status: Proposed — pending team review (see docs/decisions.md Section 8 and
# docs/assumptions.md).
#
# This is the second of two fee-sensitivity variants decided *before* any
# final testing (see configs/env_frozen_fee_low.yaml for the matching low
# variant and the rationale). It must never be chosen or adjusted after
# seeing comparison results.
#
# Every field is identical to configs/env_frozen.yaml except selling_fee_rate,
# which is doubled from 0.05 to 0.10. Even at this doubled fee, the EV
# analysis in docs/assumptions.md shows buying-and-opening packs remains
# positive-EV in every market regime, so this variant does not by itself
# remove the ALWAYS_OPEN dominant-strategy property; it only measures how
# much the edge shrinks.
horizon: 100
initial_cash: 100.0
selling_fee_rate: 0.10
pack_config: nfl_pack.json
market:
  initial_regime: NORMAL
  quotes:
    LOW: {pack_ask: 8.0, card_value_multiplier: 0.75}
    NORMAL: {pack_ask: 10.0, card_value_multiplier: 1.0}
    HIGH: {pack_ask: 12.0, card_value_multiplier: 1.6}
  transition_matrix:
    LOW: [0.7, 0.25, 0.05]
    NORMAL: [0.15, 0.7, 0.15]
    HIGH: [0.05, 0.25, 0.7]
